plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.107'
    id 'com.gradleup.shadow' version '8.3.10'
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'workers-1.21.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    // META-INF/accesstransformer.cfg uses Mojang names (NeoForge runs on Mojang mappings)
    accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        client {
            client()
            gameDirectory = project.file('run')
            programArguments.addAll '--username', 'talhanation'
        }

        server {
            server()
            gameDirectory = project.file('run')
            programArgument '--nogui'
        }

        data {
            data()
            gameDirectory = project.file('run')
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'henkelmax.public'
        url = 'https://maven.maxhenkel.de/repository/public'
    }
    mavenLocal()
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

configurations {
    // corelib api gets shaded + relocated into the workers jar (like in 1.20.1), no separate corelib download needed
    shade
    compileOnly.extendsFrom shade
}

dependencies {
    shade "de.maxhenkel.corelib:corelib:${corelib_version}:api"
    runtimeOnly "de.maxhenkel.corelib:corelib:${corelib_version}"
    runtimeOnly "de.maxhenkel.corelib:corelib:${corelib_version}:javadoc"

    // Recruits NeoForge 1.21.1 (branch 1.21.1). Not released yet: build it there (gradlew build)
    // and copy build/libs/recruits-1.21.1-<version>.jar into libs/ of this project.
    // Once released on CurseForge, replace with: implementation "curse.maven:recruits-523860:<fileId>"
    implementation files("libs/recruits-1.21.1-${recruits_version}.jar")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    archiveClassifier = 'slim'
}

shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.shade]
    relocate 'de.maxhenkel.corelib', 'de.maxhenkel.workers.corelib'
    // our own mods.toml / pack.mcmeta come first, the ones of the corelib api jar are dropped
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/MANIFEST.MF'
    manifest {
        from jar.manifest
    }
}

assemble.dependsOn shadowJar
